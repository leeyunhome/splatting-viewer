<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Viewer — 3D Gaussian Splatting</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', Arial, sans-serif;
      background: #0a0c12;
    }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #e9ebf3;
      background: rgba(10, 12, 18, 0.82);
      padding: 14px 16px;
      border: 1px solid #242a39;
      border-radius: 8px;
      z-index: 100;
      max-width: 380px;
      backdrop-filter: blur(6px);
    }
    #info h3 { margin: 0 0 6px; font-size: 15px; }
    #info p  { margin: 0; font-size: 13px; color: #9aa1bd; }
    #info small { display: block; margin-top: 10px; color: #626a86; line-height: 1.7; }
    #controls {
      position: absolute;
      top: 12px;
      right: 12px;
      color: #e9ebf3;
      background: rgba(10, 12, 18, 0.82);
      padding: 16px;
      border: 1px solid #242a39;
      border-radius: 8px;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    #controls h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.02em; }
    #fileInput {
      margin-top: 8px;
      padding: 5px;
      background: #12151e;
      color: #9aa1bd;
      border: 1px solid #242a39;
      border-radius: 6px;
      cursor: pointer;
      max-width: 220px;
    }
    button {
      padding: 9px 15px;
      margin-top: 9px;
      background: #e8b04b;
      color: #17130a;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.08); }
    button.ghost { background: transparent; color: #9aa1bd; border: 1px solid #242a39; }
    button:disabled { background: #2a2f3d; color: #626a86; cursor: not-allowed; }
    label { font-size: 13px; color: #9aa1bd; }
    a.back {
      position: absolute;
      bottom: 14px;
      left: 14px;
      z-index: 100;
      color: #9aa1bd;
      background: rgba(10, 12, 18, 0.82);
      border: 1px solid #242a39;
      border-radius: 6px;
      padding: 7px 13px;
      font: 500 12px/1 'IBM Plex Mono', monospace;
      text-decoration: none;
      backdrop-filter: blur(6px);
    }
    a.back:hover { color: #e8b04b; border-color: #e8b04b; }
  </style>
</head>
<body>
  <div id="info">
    <h3>3D Gaussian Splatting — Viewer</h3>
    <p>Load a preset below, or select your own PLY/splat file</p>
    <small>
      <strong>Controls</strong><br>
      Left drag: rotate &nbsp;·&nbsp; Right drag / arrows: pan<br>
      Wheel / middle drag: zoom
    </small>
  </div>

  <div id="controls">
    <h4>Load a model</h4>
    <input type="file" id="fileInput" accept=".ply,.splat,.spz,.ksplat" />
    <h4 style="margin-top: 16px;">Presets</h4>
    <button id="loadTomato">Tomato greenhouse — 1.33M splats (71 MB)</button>
    <br>
    <button id="loadMechander">Mechander — 388k splats (92 MB)</button>
    <br>
    <button id="loadGunpla">Gunpla — 380k splats (94 MB)</button>
    <br>
    <button id="loadAirplane">Vintage Airplane Museum — 316k splats (78 MB)</button>
    <br>
    <button id="loadDefault" class="ghost">Default Butterfly (small)</button>
    <label style="display: block; margin-top: 15px;">
      <input type="checkbox" id="autoRotate" checked> Auto rotate
    </label>
    <label style="display: block; margin-top: 6px;">
      <input type="checkbox" id="invertY"> Invert Y (flip 180°)
    </label>
  </div>

  <a class="back" href="../">&larr; Project overview</a>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.178.0/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SplatMesh } from "@sparkjsdev/spark";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = true;
    controls.minDistance = 0.5;
    controls.maxDistance = 100;
    controls.maxPolarAngle = Math.PI;
    controls.mouseButtons = {
      LEFT: THREE.MOUSE.ROTATE,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.PAN
    };
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dir = new THREE.DirectionalLight(0xffffff, 0.5);
    dir.position.set(5, 5, 5);
    scene.add(dir);

    let currentSplat = null;
    let autoRotate = true;

    async function loadSplat(source, invertY = false) {
      if (currentSplat) {
        scene.remove(currentSplat);
        currentSplat = null;
      }
      document.getElementById('invertY').checked = invertY;
      document.querySelector('#info p').textContent = 'Loading splat model...';
      try {
        let splatMesh;
        if (typeof source === 'string') {
          splatMesh = new SplatMesh({ url: source });
        } else {
          const arrayBuffer = await source.arrayBuffer();
          const url = URL.createObjectURL(new Blob([arrayBuffer]));
          splatMesh = new SplatMesh({ url });
        }
        splatMesh.position.set(0, 0, -3);
        splatMesh.rotation.x = invertY ? Math.PI : 0;
        scene.add(splatMesh);
        currentSplat = splatMesh;

        splatMesh.addEventListener('load', () => {
          const n = splatMesh.geometry?.getAttribute('position')?.count;
          document.querySelector('#info p').textContent =
            n ? `Loaded — ${n.toLocaleString()} splats` : 'Loaded.';
        });
        splatMesh.addEventListener('error', (e) => {
          document.querySelector('#info p').textContent = 'Error loading model: ' + e.message;
          console.error('Load error:', e);
        });
      } catch (error) {
        document.querySelector('#info p').textContent = 'Error: ' + error.message;
        console.error('Error loading splat:', error);
      }
    }

    document.getElementById('fileInput').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        document.querySelector('#info p').textContent = `Loading ${file.name}...`;
        loadSplat(file);
      }
    });
    document.getElementById('loadDefault').addEventListener('click', () => {
      loadSplat("https://sparkjs.dev/assets/splats/butterfly.spz");
    });
    document.getElementById('loadTomato').addEventListener('click', () => {
      document.querySelector('#info p').textContent = 'Loading Tomato greenhouse (71MB) — this may take 30s+...';
      loadSplat('../models/tomato_greenhouse.ply', true);
    });
    document.getElementById('loadMechander').addEventListener('click', () => {
      document.querySelector('#info p').textContent = 'Loading Mechander (92MB) — this may take 30s+...';
      loadSplat('../models/mechander.ply', false);
    });
    document.getElementById('loadGunpla').addEventListener('click', () => {
      document.querySelector('#info p').textContent = 'Loading Gunpla (94MB) — this may take 30s+...';
      loadSplat('../models/gunpla.ply', false);
    });
    document.getElementById('loadAirplane').addEventListener('click', () => {
      document.querySelector('#info p').textContent = 'Loading Vintage Airplane Museum (78MB) — this may take 30s+...';
      loadSplat('../models/vintage_airplane_museum.ply', false);
    });
    document.getElementById('autoRotate').addEventListener('change', (e) => {
      autoRotate = e.target.checked;
    });
    document.getElementById('invertY').addEventListener('change', (e) => {
      if (currentSplat) currentSplat.rotation.x = e.target.checked ? Math.PI : 0;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
      if (currentSplat && autoRotate) currentSplat.rotation.y += 0.01;
    });
  </script>
</body>
</html>
